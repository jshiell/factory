{% extends "base.html" %}
{% block content %}
<p>{{ action.question }}</p>
<p>Goal: {{ task.goal }}</p>
{% block details %}{% endblock %}
<form method="post" action="{{ base | default('/ui') }}/tasks/{{ task.id | urlencode }}/{{ action.name }}">
{% block fields %}{% endblock %}
<button type="submit">{{ action.button }}</button>
</form>
<p><a href="{{ base | default('/ui') }}/tasks/{{ task.id | urlencode }}">Back to the task</a></p>
{% endblock %}
