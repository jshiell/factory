<table>
  <thead><tr><th>Id</th><th>State</th><th>Goal</th><th>Failure</th></tr></thead>
  <tbody>
  {% for task in tasks %}
    <tr{% if task.needs_you %} class="needs-you"{% endif %}>
      <td><a href="{{ base | default('/ui') }}/tasks/{{ task.id | urlencode }}">{{ task.id }}</a></td>
      <td>{{ task.state | humanise }}{% if task.needs_you %} (<strong>Needs you</strong>){% endif %}</td>
      <td>{{ task.goal }}</td>
      <td>{{ task.failure_reason or "" }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% if skipped %}
<p class="skipped">Unreadable tasks skipped: {{ skipped | join(", ") }}</p>
{% endif %}
