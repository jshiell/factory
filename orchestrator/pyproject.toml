[project]
name = "factory"
version = "0.1.0"
description = "Personal agentic software factory orchestrator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.16.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
factory = "factory.cli:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_cli_migrate_procs.py" = ["F811"]  # imports the ctx fixture from test_cli_migrate
