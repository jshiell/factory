[project]
name = "factory"
version = "0.1.0"
description = "Personal agentic software factory orchestrator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
factory = "factory.launcher:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["smoke: a fast subset, one or two tests per core seam; run with `pytest -m smoke`"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF059"]

