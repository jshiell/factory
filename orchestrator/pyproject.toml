[project]
name = "factory"
version = "0.1.0"
description = "Personal agentic software factory orchestrator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
factory = "factory.cli:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
